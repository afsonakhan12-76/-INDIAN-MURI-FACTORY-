<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password | INDIAN MURI FACTORY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;
 align-items:center;justify-content:center;
 font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#123c32,#087f65,#d5a52a);
 padding:20px
}
.card{
 width:100%;max-width:420px;padding:30px;
 background:#ffffffed;border-radius:18px;
 box-shadow:0 10px 35px #0004
}
h2{text-align:center;color:#145b43}
input,button{
 width:100%;padding:14px;margin-top:14px;
 border-radius:9px;font-size:16px
}
input{border:1px solid #aaa}
button{
 border:0;background:#087f65;color:white;
 font-weight:bold;cursor:pointer
}
#msg{text-align:center;margin-top:15px}
</style>
</head>

<body>
<div class="card">
<h2>INDIAN MURI FACTORY</h2>
<h3>Reset Password</h3>
<p>Enter your new password below.</p>

<form id="resetForm">
<input id="password" type="password"
placeholder="New Password" minlength="8" required>

<input id="confirmPassword" type="password"
placeholder="Confirm New Password" minlength="8" required>

<button type="submit">Update Password</button>
</form>

<div id="msg"></div>
</div>

<script>
const msg=document.getElementById("msg");

async function init(){
 if(!window.AFSONA_CONFIG ||
    !window.AFSONA_CONFIG_READY ||
    !window.supabase){
   msg.textContent="Configuration error. Check config.js.";
   return;
 }

 const db=window.supabase.createClient(
   window.AFSONA_CONFIG.SUPABASE_URL,
   window.AFSONA_CONFIG.SUPABASE_ANON_KEY
 );

 window.resetDB=db;

 const {data,error}=await db.auth.getSession();

 if(error || !data.session){
   msg.textContent="Please open the password recovery link sent to your email first.";
   document.getElementById("resetForm").style.display="none";
 }
}

document.getElementById("resetForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const p=document.getElementById("password").value;
 const c=document.getElementById("confirmPassword").value;

 if(p.length<8){
   msg.textContent="Password must be at least 8 characters.";
   return;
 }
 if(p!==c){
   msg.textContent="Passwords do not match.";
   return;
 }

 msg.textContent="Updating password...";

 const {error}=await window.resetDB.auth.updateUser({
   password:p
 });

 if(error){
   msg.textContent="Error: "+error.message;
   return;
 }

 msg.textContent="Password updated successfully. You can now login.";
});
init();
</script>
</body>
</html>
