<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Delivery - INDIAN MURI FACTORY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
body{font-family:Arial;background:#f1f5f9;margin:0;padding:18px}
.card{background:white;padding:18px;border-radius:12px;margin:12px 0}
input,button{width:100%;padding:13px;margin:7px 0;box-sizing:border-box}
button{background:#123d55;color:white;border:0;border-radius:8px}
h2{color:#123d55}
pre{white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body>
<h2>INDIAN MURI FACTORY</h2>
<div class="card">
<h3>Driver Login</h3>
<input id="password" type="password" placeholder="Delivery Password">
<button onclick="login()">Open Invoice</button>
<p id="msg"></p>
</div>
<div class="card" id="invoice" hidden>
<h3>Invoice Details</h3>
<pre id="details"></pre>
</div>
<script>
const cfg=window.AFSONA_CONFIG;
const db=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const rawToken=new URLSearchParams(location.search).get("token");

async function login(){
 const msg=document.getElementById("msg");
 if(!rawToken){msg.textContent="Invoice QR token missing";return;}
 const password=document.getElementById("password").value.trim();
 if(!password){msg.textContent="Enter password";return;}
 msg.textContent="Loading...";
 try{
  const bytes=new TextEncoder().encode(rawToken);
  const hash=await crypto.subtle.digest("SHA-256",bytes);
  const tokenHash=Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
  const {data,error}=await db.rpc("get_delivery_invoice",{
   p_token_hash:tokenHash,p_password:password
  });
  if(error) throw error;
  document.getElementById("details").textContent=JSON.stringify(data,null,2);
  document.getElementById("invoice").hidden=false;
  msg.textContent="Invoice opened successfully";
 }catch(e){msg.textContent="Error: "+e.message;}
}
</script>
</body>
</html>
