<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driver Management - INDIAN MURI FACTORY</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:#123d35;color:white;padding:20px;text-align:center}
.container{max-width:950px;margin:20px auto;padding:12px}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 3px 14px #0000000c}
h3{color:#087f5b;margin-top:0}
input,select{width:100%;padding:12px;margin:7px 0 13px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}
label{font-weight:bold;font-size:14px}
button{padding:12px 16px;border:0;border-radius:8px;background:#087f5b;color:white;font-weight:bold;cursor:pointer;margin:5px 4px 5px 0}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#334155}
.danger{background:#b91c1c}
.hidden{display:none!important}
.message{padding:12px;border-radius:8px;margin:10px 0}
.error{background:#fee2e2;color:#991b1b}
.success{background:#dcfce7;color:#166534}
.delivery{border:1px solid #e2e8f0;padding:14px;border-radius:10px;margin:10px 0}
.delivery p{margin:6px 0}
.linkbox{background:#f1f5f9;padding:12px;border-radius:8px;word-break:break-all}
</style>
</head>

<body>

<header>
<h2>INDIAN MURI FACTORY</h2>
<div>Driver Management Panel</div>
</header>

<div class="container">

<div id="loginCard" class="card">
<h3>Admin Login</h3>

<label>Email Address</label>
<input id="email" type="email" placeholder="Enter admin email">

<label>Password</label>
<input id="password" type="password" placeholder="Enter admin password">

<button id="loginBtn" onclick="adminLogin()">Login</button>

<div id="loginMessage"></div>
</div>

<div id="adminArea" class="hidden">

<div class="card">
<h3>Create Driver Delivery</h3>

<label>Select Delivery</label>
<select id="deliverySelect">
<option value="">Select Delivery</option>
</select>

<label>Driver Name</label>
<input id="driverName" type="text" placeholder="Enter driver name">

<label>Driver Mobile Number</label>
<input id="driverMobile" type="tel" placeholder="Enter mobile number">

<label>Driver Password</label>
<input id="driverPassword" type="password" placeholder="Create driver password">

<button id="createBtn" onclick="createDriverLink()">Generate Driver Link</button>

<div id="createMessage"></div>

<div id="generatedLinkArea" class="hidden">
<h3>Generated Driver Link</h3>

<div id="generatedLink" class="linkbox"></div>

<button onclick="copyDriverLink()">Copy Link</button>
<button onclick="shareDriverLink()">Share on WhatsApp</button>
</div>
</div>

<div class="card">
<h3>Delivery List</h3>

<button onclick="loadDeliveries()">Refresh Delivery List</button>

<div id="deliveryList">Loading deliveries...</div>
</div>

<button class="danger" onclick="adminLogout()">Logout</button>

</div>
</div>

<script>
let client;
let currentDriverLink="";
let adminVerified=false;
let authCheckRunning=false;

const DRIVER_PAGE_URL =
"https://afsonakhan12-76.github.io/-INDIAN-MURI-FACTORY-/driver.html";

function getConfig(){
  const c=window.APP_CONFIG || window.CONFIG || {};

  return {
    url:window.SUPABASE_URL || window.supabaseUrl || c.SUPABASE_URL || c.supabaseUrl,
    key:window.SUPABASE_ANON_KEY || window.supabaseAnonKey || c.SUPABASE_ANON_KEY || c.supabaseAnonKey
  };
}

function initSupabase(){
  const cfg=getConfig();

  if(!cfg.url || !cfg.key || !window.supabase){
    throw new Error("Please check your Supabase URL and Anon Key in config.js.");
  }

  client=window.supabase.createClient(cfg.url,cfg.key);
}

function message(id,text,type="error"){
  const el=document.getElementById(id);
  el.className="message "+type;
  el.textContent=text;
}

function setAdminVisible(visible){
  document.getElementById("adminArea").classList.toggle("hidden",!visible);
  document.getElementById("loginCard").classList.toggle("hidden",visible);
}

async function verifyAdmin(){
  const {data:{user},error:userError}=await client.auth.getUser();

  if(userError || !user) return false;

  const {data,error}=await client
    .from("profiles")
    .select("role,status")
    .eq("id",user.id)
    .maybeSingle();

  if(error) throw error;

  return !!data &&
    data.role==="admin" &&
    data.status==="approved";
}

async function adminLogin(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email || !password){
    message("loginMessage","Please enter your email and password.");
    return;
  }

  document.getElementById("loginBtn").disabled=true;

  try{
    const {error}=await client.auth.signInWithPassword({
      email,
      password
    });

    if(error) throw error;

    const allowed=await verifyAdmin();

    if(!allowed){
      await client.auth.signOut();
      throw new Error("Your account is not an approved administrator.");
    }

    adminVerified=true;
    setAdminVisible(true);

    await loadDeliveries();

  }catch(e){
    message("loginMessage",e.message || "Login failed.");
  }finally{
    document.getElementById("loginBtn").disabled=false;
  }
}

async function loadDeliveries(){
  if(!adminVerified) return;

  const list=document.getElementById("deliveryList");
  const select=document.getElementById("deliverySelect");

  list.textContent="Loading deliveries...";

  try{
    const allowed=await verifyAdmin();

    if(!allowed){
      throw new Error("Administrator permission required.");
    }

    const {data,error}=await client.rpc("get_driver_admin_panel");

    if(error) throw error;

    if(data?.success===false){
      throw new Error(data.message || "Unable to load deliveries.");
    }

    const deliveries=Array.isArray(data)?data:(data?.deliveries || []);

    select.replaceChildren();

    const first=document.createElement("option");
    first.value="";
    first.textContent="Select Delivery";
    select.appendChild(first);

    list.replaceChildren();

    if(deliveries.length===0){
      list.textContent="No deliveries found.";
      return;
    }

    deliveries.forEach(d=>{
      const id=d.id || d.delivery_id;

      if(!id) return;

      const option=document.createElement("option");
      option.value=id;

      option.textContent=
        (d.delivery_number || id)+" - "+
        (d.customer_name || d.customer?.name || "Customer");

      select.appendChild(option);

      const card=document.createElement("div");
      card.className="delivery";

      const heading=document.createElement("h4");
      heading.textContent="Delivery: "+(d.delivery_number || id);
      card.appendChild(heading);

      const lines=[
        "Customer: "+(d.customer_name || d.customer?.name || "N/A"),
        "Mobile: "+(d.customer_mobile || d.customer?.mobile || "N/A"),
        "Date: "+(d.delivery_date || "N/A"),
        "Status: "+(d.status || "N/A"),
        "Driver: "+(d.driver_name || "Not Assigned")
      ];

      lines.forEach(line=>{
        const p=document.createElement("p");
        p.textContent=line;
        card.appendChild(p);
      });

      list.appendChild(card);
    });

  }catch(e){
    list.textContent=e.message || "Unable to load deliveries.";
  }
}

async function createDriverLink(){
  if(!adminVerified){
    message("createMessage","Administrator login required.");
    return;
  }

  const deliveryId=document.getElementById("deliverySelect").value;
  const driverName=document.getElementById("driverName").value.trim();
  const driverMobile=document.getElementById("driverMobile").value.trim();
  const password=document.getElementById("driverPassword").value;

  if(!deliveryId){
    message("createMessage","Please select a delivery.");
    return;
  }

  if(!driverName || !driverMobile || !password){
    message("createMessage","Please enter driver name, mobile number and password.");
    return;
  }

  if(password.length<8){
    message("createMessage","Please use a password with at least 8 characters.");
    return;
  }

  document.getElementById("createBtn").disabled=true;

  try{
    const allowed=await verifyAdmin();

    if(!allowed){
      throw new Error("Administrator permission denied.");
    }

    const {data,error}=await client.rpc("create_driver_delivery_access",{
      p_delivery_id:deliveryId,
      p_driver_name:driverName,
      p_driver_mobile:driverMobile,
      p_password:password
    });

    if(error) throw error;

    if(!data || data.success===false){
      throw new Error(data?.message || "Unable to create driver link.");
    }

    const token=data.token || data.access_token;

    if(!token){
      throw new Error("Token was not returned by the server.");
    }

    currentDriverLink=
      DRIVER_PAGE_URL+"?token="+encodeURIComponent(token);

    document.getElementById("generatedLink").textContent=currentDriverLink;

    document.getElementById("generatedLinkArea").classList.remove("hidden");

    document.getElementById("driverPassword").value="";

    message("createMessage","Driver link generated successfully.","success");

    await loadDeliveries();

  }catch(e){
    message("createMessage",e.message || "Unable to generate driver link.");
  }finally{
    document.getElementById("createBtn").disabled=false;
  }
}

async function copyDriverLink(){
  if(!currentDriverLink) return;

  try{
    await navigator.clipboard.writeText(currentDriverLink);

    message("createMessage","Driver link copied successfully.","success");

  }catch(e){
    message("createMessage","Unable to copy link. Please copy it manually.");
  }
}

function shareDriverLink(){
  if(!currentDriverLink) return;

  const text=
    "INDIAN MURI FACTORY Driver Delivery Portal\n"+
    "Your delivery link: "+currentDriverLink;

  window.open(
    "https://wa.me/?text="+encodeURIComponent(text),
    "_blank"
  );
}

async function adminLogout(){
  adminVerified=false;
  setAdminVisible(false);
  await client.auth.signOut();
}

async function restoreSession(){
  if(authCheckRunning) return;

  authCheckRunning=true;

  try{
    const {data:{session}}=await client.auth.getSession();

    if(!session) return;

    const allowed=await verifyAdmin();

    if(allowed){
      adminVerified=true;
      setAdminVisible(true);
      await loadDeliveries();
    }else{
      await client.auth.signOut();
      setAdminVisible(false);
    }

  }catch(e){
    console.error(e);
    setAdminVisible(false);
  }finally{
    authCheckRunning=false;
  }
}

try{
  initSupabase();

  restoreSession();

  client.auth.onAuthStateChange((event,session)=>{
    if(event==="SIGNED_OUT"){
      adminVerified=false;
      setAdminVisible(false);
    }
  });

}catch(e){
  message("loginMessage",e.message);
  document.getElementById("loginBtn").disabled=true;
}
</script>

</body>
</html>
